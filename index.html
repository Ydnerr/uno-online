<!doctype html>
<!--
SETUP FIREBASE (sekali saja, gratis, tanpa kartu kredit):
1. console.firebase.google.com > Add project > pilih Spark (gratis).
2. Build > Authentication > Sign-in method > aktifkan "Anonymous".
3. Build > Realtime Database > Create database > mulai dalam mode locked.
4. Tab Rules, ganti isinya dengan ini lalu Publish:
{
 "rules": {
  "rooms": {"$r": {
    ".read": "auth != null",
    ".write": "auth != null && (!data.exists() || data.child('host').val() === auth.uid)",
    "players": {"$u": {".write": "auth != null && auth.uid === $u"}}
  }},
  "acts": {"$r": {".read": "auth != null", "$u": {".write": "auth != null && auth.uid === $u"}}},
  "hands": {"$r": {"$u": {
    ".read": "auth != null && auth.uid === $u",
    ".write": "auth != null && root.child('rooms').child($r).child('host').val() === auth.uid"
  }}}
 }
}
5. Project settings > Your apps > Web (</>) > salin firebaseConfig ke FB di bawah.
6. Authentication > Settings > Authorized domains: tambahkan username.github.io
-->
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Uno Online</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--R:#e5322d;--Y:#f2b705;--G:#2fa84f;--B:#1f6fd1;--bg:#171a26;--tx:#f3f1ea}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 70% at 50% 0,#272c42,var(--bg));color:var(--tx);font:600 16px Nunito,system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
input,button{font:inherit}
input{width:100%;padding:14px;border-radius:12px;border:2px solid #3a4160;background:#0f111a;color:var(--tx);margin:6px 0}
button{padding:14px;border:0;border-radius:12px;font-weight:800;background:var(--Y);color:#1a1a1a;width:100%;margin:6px 0}
button.s{background:#2d3350;color:var(--tx)}
button:disabled{opacity:.4}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
.w{max-width:480px;width:100%;margin:0 auto;padding:16px;flex:1;flex-direction:column;display:none}
.logo{align-self:center;margin:28px 0 20px;background:var(--R);color:#fff;font:400 56px 'Lilita One';padding:6px 28px;border:5px solid #fff;border-radius:22px;transform:rotate(-6deg);box-shadow:0 6px 0 #0005}
#er{color:#ff8a80;min-height:22px;margin:6px 0}
hr{border:0;border-top:2px dashed #39405a;margin:18px 0}
#cd{font:400 64px 'Lilita One';letter-spacing:.12em;text-align:center;background:#0f111a;border-radius:16px;padding:10px;margin:10px 0;cursor:pointer}
#pl{list-style:none;padding:0;margin:8px 0 14px}
#pl li{background:#252a40;border-radius:12px;padding:12px 14px;margin:6px 0}
.c{width:62px;height:94px;padding:0;margin:0;border-radius:10px;border:3px solid #fff;display:flex;align-items:center;justify-content:center;position:relative;flex:none;background:var(--c);color:#fff;font:400 32px 'Lilita One';box-shadow:0 3px 8px #0006}
.c::before{content:"";position:absolute;inset:9% 5%;background:#fff;border-radius:50%;transform:rotate(-24deg)}
.c span{position:relative;color:var(--c);-webkit-text-stroke:1.5px #0003}
.cR{--c:var(--R)}.cY{--c:var(--Y)}.cG{--c:var(--G)}.cB{--c:var(--B)}.cW{--c:#15161b}
.cW::before{background:conic-gradient(var(--R) 0 25%,var(--Y) 0 50%,var(--G) 0 75%,var(--B) 0)}
.cW span{color:#fff;-webkit-text-stroke:0;text-shadow:0 1px 3px #000}
.back::before{background:var(--R)}.back span{color:#fff;font-size:19px;transform:rotate(-24deg);-webkit-text-stroke:0}
.dot{width:24px;height:24px;border-radius:50%;background:var(--c);border:3px solid #fff}
#op{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:6px 0}
.o{background:#252a40;border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:center;border:2px solid transparent}
.o.t{border-color:var(--Y)}
.o i{font-style:normal;background:#fff;color:#111;border-radius:99px;padding:0 9px;font-weight:800}
.o em{color:var(--Y);font-style:normal;font-weight:800}
#mid{flex:1;display:flex;align-items:center;justify-content:center;gap:20px;min-height:150px}
#st{text-align:center;font-weight:800;font-size:18px}
#lg{text-align:center;opacity:.7;min-height:22px;margin-bottom:4px}
#hd{display:flex;gap:8px;overflow-x:auto;padding:24px 16px 12px;margin:0 -16px}
#hd .c.p{transform:translateY(-12px)}
#pk{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:30px}
#pk[hidden]{display:none}
#pk button{width:96px;height:96px;border-radius:50%;border:4px solid #fff;background:var(--c)}
.row{display:flex;gap:10px}
</style></head><body>

<div class="w" id="h">
 <div class="logo">UNO</div>
 <input id="nm" placeholder="Nama lu" maxlength="12" autocomplete="off">
 <button id="mk">Buat room</button>
 <hr>
 <input id="jc" placeholder="Kode room" maxlength="4" autocapitalize="characters" autocomplete="off">
 <button class="s" id="jn">Masuk room</button>
 <div id="er"></div>
</div>

<div class="w" id="l">
 <div class="logo" style="font-size:36px;margin:12px 0">UNO</div>
 <div style="text-align:center">Kode room (ketuk untuk salin)</div>
 <div id="cd"></div>
 <ul id="pl"></ul>
 <button id="go">Mulai game</button>
 <div id="wt" style="text-align:center">Nunggu room master mulai game…</div>
 <button class="s" id="lv">Keluar</button>
</div>

<div class="w" id="g">
 <div id="op"></div>
 <div id="mid">
  <button class="c back" id="dr" aria-label="Ambil kartu"><span>UNO</span></button>
  <div id="tp"></div>
  <div class="dot" id="col"></div>
 </div>
 <div id="st"></div>
 <div id="lg"></div>
 <div class="row"><button id="ps" class="s" hidden>Lewati</button><button id="ag" hidden>Main lagi</button></div>
 <div id="hd"></div>
</div>

<div id="pk" hidden>
 <button class="cR" data-k="R" aria-label="Merah"></button><button class="cY" data-k="Y" aria-label="Kuning"></button>
 <button class="cG" data-k="G" aria-label="Hijau"></button><button class="cB" data-k="B" aria-label="Biru"></button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
window.onerror=m=>{['h','l','g'].forEach(x=>document.getElementById(x).style.display=x=='h'?'flex':'none');document.getElementById('er').textContent='Error: '+m};
window.onunhandledrejection=e=>window.onerror(e.reason&&e.reason.message||e.reason);
const FB={
    apiKey: "AIzaSyCw7pXeXDHM9gY86KncyEoOXoyMEVCgS1c",
    authDomain: "uno-online-efec8.firebaseapp.com",
    databaseURL: "https://uno-online-efec8-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "uno-online-efec8",
    storageBucket: "uno-online-efec8.firebasestorage.app",
    messagingSenderId: "176281576786",
    appId: "1:176281576786:web:d29be6daf0adc49c9f868b"
  };
firebase.initializeApp(FB);
const db=firebase.database(),$=s=>document.querySelector(s);
let uid,code,room,hand=[],H=null,isHost=false,pick=null,name='';

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=u=>room&&room.players&&room.players[u]?room.players[u].n:'?';
const lab=c=>c[0]=='W'?(c[1]=='4'?'+4':''):({S:'⊘',R:'⇄','+':'+2'}[c[1]]||c[1]);
const ok=(c,t,col)=>c[0]=='W'||c[0]==col||(t[0]!='W'&&c[1]==t[1]);
const face=(c,x='')=>`<div class="c c${c[0]}${x}"><span>${lab(c)}</span></div>`;
const show=id=>['h','l','g'].forEach(x=>$('#'+x).style.display=x==id?'flex':'none');
const err=m=>$('#er').textContent=m;
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ===== Mesin game (hanya jalan di HP room master) ===== */
function mkDeck(){const d=[];for(const c of'RYGB'){d.push(c+'0');for(let i=1;i<=9;i++)d.push(c+i,c+i);for(const v of'SR+')d.push(c+v,c+v)}for(let i=0;i<4;i++)d.push('WC','W4');return shuf(d)}
function drawN(u,n){for(let i=0;i<n;i++){if(!H.deck.length){const t=H.disc.pop();H.deck=shuf(H.disc);H.disc=[t]}if(!H.deck.length)break;H.hands[u].push(H.deck.pop())}}
function push(){
 const s={...H.st,deck:H.deck.length,counts:{}},up={};
 for(const u in H.hands){s.counts[u]=H.hands[u].length;up['hands/'+code+'/'+u]=H.hands[u]}
 up['rooms/'+code+'/g']=s;db.ref().update(up);
}
function start(){
 const ids=Object.keys(room.players);
 H.deck=mkDeck();H.hands={};
 ids.forEach(u=>{H.hands[u]=[];drawN(u,7)});
 let t;do{t=H.deck.pop();if(!/\d/.test(t[1]))H.deck.unshift(t)}while(!/\d/.test(t[1]));
 H.disc=[t];
 H.st={order:shuf(ids.slice()),dir:1,ti:0,top:t,color:t[0],drew:false,winner:null,log:'Game dimulai'};
 push();
}
function act(u,a){
 const s=H.st;if(!s||s.winner||s.order[s.ti]!==u)return;
 const me=H.hands[u],L=s.order.length;
 const adv=n=>{s.ti=((s.ti+s.dir*n)%L+L)%L},nxu=()=>s.order[((s.ti+s.dir)%L+L)%L];
 if(a.t=='draw'&&!s.drew){
  drawN(u,1);const c=me[me.length-1];s.log=nm(u)+' ambil kartu';
  if(c&&ok(c,s.top,s.color))s.drew=true;else adv(1);
 }else if(a.t=='pass'&&s.drew){s.drew=false;adv(1);s.log=nm(u)+' lewat'}
 else if(a.t=='play'){
  const c=a.c,i=s.drew?(me[me.length-1]===c?me.length-1:-1):me.indexOf(c);
  if(i<0||!ok(c,s.top,s.color))return;
  me.splice(i,1);H.disc.push(c);s.top=c;s.drew=false;
  s.color=c[0]=='W'?('RYGB'.includes(a.k)?a.k:'R'):c[0];
  s.log=nm(u)+' main '+(c[0]=='W'?'Wild':lab(c)||c[0]);
  if(!me.length){s.winner=u;s.log=nm(u)+' menang!'}
  else{
   const v=c[1];let sk=1;
   if(v=='R'){s.dir*=-1;if(L==2)sk=2}
   if(v=='S')sk=2;
   if(v=='+'){drawN(nxu(),2);sk=2}
   if(c=='W4'){drawN(nxu(),4);sk=2}
   adv(sk);
  }
 }else return;
 push();
}
function hostListen(){
 db.ref('acts/'+code).on('value',sn=>{
  const v=sn.val()||{};
  for(const u in v)if(v[u].n!==H.lastN[u]){H.lastN[u]=v[u].n;act(u,v[u])}
 });
}
const send=a=>{a.n=Date.now()+Math.random();db.ref('acts/'+code+'/'+uid).set(a)};

/* ===== Room ===== */
async function mkRoom(){
 name=$('#nm').value.trim();if(!name)return err('Isi nama dulu');
 localStorage.nm=name;
 const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c,ex=true;
 while(ex){c=Array.from({length:4},()=>A[Math.random()*A.length|0]).join('');ex=(await db.ref('rooms/'+c).once('value')).exists()}
 await db.ref('rooms/'+c).set({host:uid,players:{[uid]:{n:name}}});
 enter(c);
}
async function joinRoom(){
 name=$('#nm').value.trim();if(!name)return err('Isi nama dulu');
 localStorage.nm=name;
 const c=$('#jc').value.trim().toUpperCase(),r=(await db.ref('rooms/'+c).once('value')).val();
 if(!r)return err('Room nggak ketemu');
 if(!r.players[uid]){
  if(r.g)return err('Game sudah jalan');
  if(Object.keys(r.players).length>=4)return err('Room penuh (maks 4)');
 }
 await db.ref('rooms/'+c+'/players/'+uid).set({n:name});
 enter(c);
}
function enter(c){
 code=c;localStorage.rm=c;
 db.ref('rooms/'+c).on('value',sn=>{
  room=sn.val();
  if(!room){localStorage.removeItem('rm');return location.reload()}
  if(room.host===uid&&!H){isHost=true;H={deck:[],disc:[],hands:{},st:null,lastN:{}};hostListen()}
  render();
 });
 db.ref('hands/'+c+'/'+uid).on('value',sn=>{hand=sn.val()||[];render()});
}
function leave(){
 localStorage.removeItem('rm');
 if(isHost)db.ref('rooms/'+code).remove().then(()=>location.reload());
 else if(room&&!room.g)db.ref('rooms/'+code+'/players/'+uid).remove().then(()=>location.reload());
 else location.reload();
}

/* ===== Tampilan ===== */
function render(){
 if(!room)return;
 const g=room.g;
 if(!g){
  show('l');$('#cd').textContent=code;
  const ps=Object.values(room.players);
  $('#pl').innerHTML=ps.map(p=>`<li>${esc(p.n)}</li>`).join('');
  $('#go').style.display=isHost?'':'none';$('#go').disabled=ps.length<2;
  $('#wt').style.display=isHost?'none':'';
  return;
 }
 show('g');
 const cur=g.order[g.ti],my=cur===uid&&!g.winner;
 $('#op').innerHTML=g.order.filter(u=>u!==uid).map(u=>{const n=g.counts[u]||0;return `<div class="o${cur===u&&!g.winner?' t':''}"><b>${esc(nm(u))}</b><i>${n}</i>${n==1?'<em>UNO!</em>':''}</div>`}).join('');
 $('#tp').innerHTML=face(g.top);
 $('#col').className='dot c'+g.color;
 $('#dr').disabled=!my||g.drew;
 $('#st').textContent=g.winner?(g.winner===uid?'Lu menang!':nm(g.winner)+' menang!'):(my?'Giliran lu':'Giliran '+nm(cur));
 $('#lg').textContent=g.log||'';
 $('#ps').hidden=!(my&&g.drew);
 $('#ag').hidden=!(isHost&&g.winner);
 const last=hand.length-1,o='RYGBW';
 $('#hd').innerHTML=hand.map((c,i)=>({c,i})).sort((a,b)=>o.indexOf(a.c[0])-o.indexOf(b.c[0])||a.c.localeCompare(b.c)).map(({c,i})=>{
  const p=my&&(g.drew?i==last:true)&&ok(c,g.top,g.color);
  return `<button class="c c${c[0]}${p?' p':''}" data-i="${i}" ${p?'':'disabled'} aria-label="${c}"><span>${lab(c)}</span></button>`;
 }).join('');
}

$('#mk').onclick=mkRoom;$('#jn').onclick=joinRoom;$('#lv').onclick=leave;
$('#go').onclick=start;$('#ag').onclick=start;
$('#dr').onclick=()=>send({t:'draw'});$('#ps').onclick=()=>send({t:'pass'});
$('#cd').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(code);
$('#hd').onclick=e=>{
 const b=e.target.closest('.c');if(!b||b.disabled)return;
 const c=hand[+b.dataset.i];
 if(c[0]=='W'){pick=c;$('#pk').hidden=false}else send({t:'play',c});
};
$('#pk').onclick=e=>{
 const b=e.target.closest('button');$('#pk').hidden=true;
 if(b&&pick)send({t:'play',c:pick,k:b.dataset.k});pick=null;
};

firebase.auth().signInAnonymously().then(r=>{
 uid=r.user.uid;$('#nm').value=localStorage.nm||'';show('h');
 const c=localStorage.rm;if(!c)return;
 db.ref('rooms/'+c).once('value').then(sn=>{
  const v=sn.val();
  if(v&&v.players&&v.players[uid]&&!(v.host===uid&&v.g))enter(c);else localStorage.removeItem('rm');
 });
}).catch(e=>{show('h');err('Gagal terhubung: '+e.message)});
</script>
</body></html>
